<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- Rounded rect background -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="12"/>
  <!-- Clock face -->
  <circle cx="256" cy="256" r="140" fill="rgba(255,255,255,0.08)"/>
  <!-- Hour marks -->
  <line x1="256" y1="126" x2="256" y2="146" stroke="rgba(255,255,255,0.4)" stroke-width="8" stroke-linecap="round"/>
  <line x1="356" y1="156" x2="346" y2="173" stroke="rgba(255,255,255,0.4)" stroke-width="8" stroke-linecap="round"/>
  <line x1="386" y1="256" x2="366" y2="256" stroke="rgba(255,255,255,0.4)" stroke-width="8" stroke-linecap="round"/>
  <line x1="356" y1="356" x2="346" y2="339" stroke="rgba(255,255,255,0.4)" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="386" x2="256" y2="366" stroke="rgba(255,255,255,0.4)" stroke-width="8" stroke-linecap="round"/>
  <line x1="156" y1="356" x2="166" y2="339" stroke="rgba(255,255,255,0.4)" stroke-width="8" stroke-linecap="round"/>
  <line x1="126" y1="256" x2="146" y2="256" stroke="rgba(255,255,255,0.4)" stroke-width="8" stroke-linecap="round"/>
  <line x1="156" y1="156" x2="166" y2="173" stroke="rgba(255,255,255,0.4)" stroke-width="8" stroke-linecap="round"/>
  <!-- Hour hand (pointing to ~9) -->
  <line x1="256" y1="256" x2="196" y2="256" stroke="url(#glow)" stroke-width="14" stroke-linecap="round"/>
  <!-- Minute hand (pointing to ~12) -->
  <line x1="256" y1="256" x2="256" y2="160" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="14" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="7" fill="white"/>
</svg>
