<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attendance Pro | 出退勤管理アプリ</title>
  <meta name="description" content="スマートフォンからワンタップで出退勤打刻。LINEグループへ自動通知のPWAアプリ。">
  <meta name="theme-color" content="#0f172a">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="出退勤">
  <link rel="apple-touch-icon" href="./icon.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- 古いSW・キャッシュを強制クリア -->
  <script>
    (function() {
      var CURRENT = 'v4';
      var key = 'attendance_sw_version';
      var prev = sessionStorage.getItem(key);
      sessionStorage.setItem(key, CURRENT);
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          return Promise.all(regs.map(function(r) { return r.unregister(); }));
        }).then(function() {
          return caches.keys().then(function(keys) {
            return Promise.all(keys.map(function(k) { return caches.delete(k); }));
          });
        }).then(function() {
          if (prev && prev !== CURRENT) window.location.reload(true);
        });
      }
    })();
  </script>

  <style>
    /* ===== CSS Custom Properties ===== */
    :root {
      --bg-base: #0a0f1e;
      --bg-surface: rgba(255, 255, 255, 0.05);
      --bg-surface-hover: rgba(255, 255, 255, 0.09);
      --bg-card: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.1);
      --border-focus: rgba(99, 179, 237, 0.6);
      --text-primary: #f0f6ff;
      --text-secondary: rgba(240, 246, 255, 0.55);
      --text-muted: rgba(240, 246, 255, 0.35);

      --accent-blue: #3b82f6;
      --accent-blue-glow: rgba(59, 130, 246, 0.35);
      --accent-green: #10b981;
      --accent-green-glow: rgba(16, 185, 129, 0.35);
      --accent-red: #ef4444;
      --accent-red-glow: rgba(239, 68, 68, 0.35);
      --accent-amber: #f59e0b;
      --accent-amber-glow: rgba(245, 158, 11, 0.35);

      --radius-card: 20px;
      --radius-btn: 14px;
      --radius-input: 12px;
      --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.4);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Animated Background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% -10%, rgba(59, 130, 246, 0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 100%, rgba(139, 92, 246, 0.14) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 60% 40%, rgba(16, 185, 129, 0.07) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== Layout ===== */
    #app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== Header ===== */
    header {
      padding: 20px 24px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      background: rgba(10, 15, 30, 0.6);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent-blue), #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--accent-blue-glow);
    }

    .logo-icon svg { width: 20px; height: 20px; color: white; }

    .logo-text {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }

    .logo-badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent-blue);
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 2px 8px;
      border-radius: 20px;
    }

    /* ===== Main ===== */
    main {
      flex: 1;
      padding: 24px 20px 40px;
      max-width: 440px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ===== Cards ===== */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 20px;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(12px);
    }

    .card-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* ===== Clock Card ===== */
    .clock-card {
      text-align: center;
      padding: 28px 20px;
      position: relative;
      overflow: hidden;
    }

    .clock-card::before {
      content: '';
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.12), transparent 70%);
      pointer-events: none;
    }

    #live-time {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f0f6ff 0%, rgba(240,246,255,0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 8px;
    }

    #live-date {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 20px;
    }

    /* Status badge */
    .status-wrap {
      display: flex;
      justify-content: center;
    }

    #status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 18px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all var(--transition);
    }

    #status-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .badge-out {
      background: rgba(100, 116, 139, 0.15);
      border: 1px solid rgba(100, 116, 139, 0.3);
      color: #94a3b8;
    }
    .badge-out .dot { background: #64748b; }

    .badge-in {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: var(--accent-green);
    }
    .badge-in .dot {
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse-dot 1.5s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
    }

    #clock-in-meta {
      margin-top: 12px;
      font-size: 13px;
      color: var(--accent-green);
      opacity: 0;
      transition: opacity var(--transition);
      font-weight: 500;
    }
    #clock-in-meta.visible { opacity: 1; }

    /* ===== User Card ===== */
    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .input-icon svg { width: 18px; height: 18px; }

    input[type="text"],
    input[type="url"] {
      width: 100%;
      padding: 14px 14px 14px 44px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      color: var(--text-primary);
      font-size: 15px;
      font-family: inherit;
      font-weight: 500;
      outline: none;
      transition: all var(--transition);
      -webkit-appearance: none;
    }

    input::placeholder { color: var(--text-muted); font-weight: 400; }

    input:focus {
      border-color: var(--border-focus);
      background: rgba(59, 130, 246, 0.06);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }

    /* ===== Action Buttons ===== */
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 18px 12px;
      border: none;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all var(--transition);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .btn:active:not(:disabled)::after { opacity: 0.08; }

    .btn:not(:disabled):hover { transform: translateY(-2px); }
    .btn:not(:disabled):active { transform: scale(0.97) translateY(0); }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn-in {
      background: linear-gradient(135deg, #059669, #10b981);
      color: white;
      box-shadow: 0 8px 32px var(--accent-green-glow), 0 2px 8px rgba(0,0,0,0.3);
    }

    .btn-out {
      background: linear-gradient(135deg, #dc2626, #ef4444);
      color: white;
      box-shadow: 0 8px 32px var(--accent-red-glow), 0 2px 8px rgba(0,0,0,0.3);
    }

    .btn-report {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #d97706, #f59e0b);
      color: white;
      box-shadow: 0 8px 32px var(--accent-amber-glow), 0 2px 8px rgba(0,0,0,0.3);
      font-size: 15px;
      border-radius: var(--radius-btn);
      margin-top: 12px;
    }

    .btn-text { position: relative; display: flex; align-items: center; gap: 7px; }
    .btn-text svg { width: 20px; height: 20px; }

    .btn-spinner {
      position: absolute;
      width: 22px;
      height: 22px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== Report Section ===== */
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title svg { width: 16px; height: 16px; color: var(--accent-amber); }

    .report-url-wrap input {
      padding-left: 44px;
      font-size: 13px;
    }

    /* ===== Toast ===== */
    #toast-container {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: calc(100% - 40px);
      max-width: 400px;
      pointer-events: none;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      backdrop-filter: blur(20px);
      transform: translateY(-10px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    .toast.visible {
      transform: translateY(0);
      opacity: 1;
    }

    .toast-success {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .toast-error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .toast-info {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
    }

    .toast svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* ===== Divider ===== */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ===== Install Hint ===== */
    #install-hint {
      display: none;
      text-align: center;
      padding: 12px 16px;
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 12px;
      font-size: 12px;
      color: var(--text-secondary);
      gap: 8px;
      align-items: center;
    }
    #install-hint.show { display: flex; }
    #install-hint button {
      margin-left: auto;
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    /* ===== History Log ===== */
    .history-section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .history-section-title svg { width: 16px; height: 16px; color: var(--text-muted); }

    #history-list { display: flex; flex-direction: column; gap: 2px; }

    .history-empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      padding: 16px 0;
    }

    .history-date {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      padding: 12px 0 6px;
      text-transform: uppercase;
    }
    .history-date:first-child { padding-top: 0; }

    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      transition: background var(--transition);
    }
    .history-item:hover { background: rgba(255,255,255,0.04); }

    .history-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .history-icon svg { width: 16px; height: 16px; }

    .item-in .history-icon {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
    }
    .item-out .history-icon {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
    }

    .history-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }
    .history-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-sub {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .history-time {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      font-family: 'Inter', sans-serif;
      flex-shrink: 0;
    }

    /* ===== Footer ===== */
    footer {
      text-align: center;
      padding: 0 20px 32px;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ===== Responsive ===== */
    @media (min-width: 480px) {
      main { padding: 32px 24px 48px; }
      #live-time { font-size: 60px; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2m6-2a10 10 0 11-20 0 10 10 0 0120 0z"/>
        </svg>
      </div>
      <span class="logo-text">Attendance Pro</span>
    </div>
    <span class="logo-badge">PWA</span>
  </header>

  <!-- Main Content -->
  <main>

    <!-- PWA Install Hint -->
    <div id="install-hint">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;color:#3b82f6;flex-shrink:0">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
      </svg>
      <span>ホーム画面に追加してアプリとして使う</span>
      <button id="btn-install">追加</button>
    </div>

    <!-- Clock Card -->
    <div class="card clock-card">
      <div id="live-time">--:--:--</div>
      <div id="live-date">読込中...</div>
      <div class="status-wrap">
        <div id="status-badge" class="badge-out">
          <span class="dot"></span>
          <span id="status-text">未出勤</span>
        </div>
      </div>
      <div id="clock-in-meta">出勤中 — <span id="clock-in-since"></span> から</div>
    </div>

    <!-- User Card -->
    <div class="card">
      <p class="card-label">研修生の名前</p>
      <div class="input-wrap">
        <span class="input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </span>
        <input type="text" id="user-name-input" placeholder="例: 山田 太郎" autocomplete="name" spellcheck="false">
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="btn-group">
      <button id="btn-clock-in" class="btn btn-in" onclick="App.clockIn()" disabled>
        <span class="btn-text">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
          </svg>
          出勤
        </span>
        <div class="btn-spinner"></div>
      </button>

      <button id="btn-clock-out" class="btn btn-out" onclick="App.clockOut()" disabled>
        <span class="btn-text">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          退勤
        </span>
        <div class="btn-spinner"></div>
      </button>
    </div>

    <!-- Divider -->
    <div class="divider">課題完了報告</div>

    <!-- Report Card -->
    <div class="card">
      <p class="section-title">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
        </svg>
        🎉 課題完了報告
      </p>
      <div class="report-url-wrap">
        <div class="input-wrap">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
            </svg>
          </span>
          <input type="url" id="task-url" placeholder="https://github.com/..." value="" autocomplete="off">
        </div>
      </div>
      <button id="btn-report" class="btn btn-report" onclick="App.reportTask()" disabled>
        <span class="btn-text">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
          </svg>
          課題を提出する
        </span>
        <div class="btn-spinner"></div>
      </button>
    </div>

    <!-- Divider -->
    <div class="divider">打刻ログ</div>

    <!-- History Card -->
    <div class="card">
      <p class="history-section-title">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        打刻履歴
      </p>
      <div id="history-list"></div>
    </div>

  </main>

  <footer>
    Attendance Pro &nbsp;|&nbsp; 研修課題５ &nbsp;|&nbsp; <span id="footer-year"></span>
  </footer>

</div>

<script src="./app.js"></script>
</body>
</html>
