<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attendance Pro</title>
  
  <!-- PWA Settings -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="https://fonts.gstatic.com/s/i/materialicons/fingerprint/v11/192px.svg">
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: { light: '#60a5fa', DEFAULT: '#2563eb', dark: '#1d4ed8' },
            success: { DEFAULT: '#10b981', dark: '#059669' },
            danger: { DEFAULT: '#ef4444', dark: '#b91c1c' },
            warning: { DEFAULT: '#f59e0b', dark: '#d97706' },
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">
  <!-- Toast Notification Container (Fixed) -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-11/12 max-w-md pointer-events-none"></div>

  <!-- App Header -->
  <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-40">
    <div class="px-4 py-4 flex items-center justify-center">
      <h1 class="text-xl font-bold tracking-tight text-slate-800 flex items-center gap-2">
        <svg class="w-6 h-6 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        Attendance Pro
      </h1>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 px-4 py-6 max-w-md mx-auto w-full flex flex-col gap-6">
    
    <!-- User Selection Card -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <label for="user-name-input" class="block text-sm font-semibold text-slate-600 mb-2">研修生の名前を入力</label>
      <div class="relative">
        <input type="text" id="user-name-input" placeholder="例: 山田 太郎" class="block w-full px-4 py-3 text-base border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand focus:border-brand sm:text-sm rounded-xl bg-slate-50 border transition-colors shadow-sm">
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        </div>
      </div>
    </section>

    <!-- Current Status Indicator -->
    <section class="flex flex-col items-center justify-center py-4 bg-white rounded-2xl shadow-sm border border-slate-200">
      <span class="text-sm font-medium text-slate-500 mb-1">現在のステータス</span>
      <div id="status-badge" class="px-4 py-1.5 rounded-full text-lg font-bold bg-slate-100 text-slate-600 transition-colors duration-300">
        未出勤
      </div>
      <div id="clock-in-time-display" class="text-xs text-slate-400 mt-2 hidden">出勤時間: <span id="clock-in-time-value"></span></div>
    </section>

    <!-- Clock Action Buttons -->
    <section class="flex flex-col gap-4">
      <button id="btn-clock-in" onclick="App.clockIn()" class="relative flex items-center justify-center w-full py-4 text-white font-bold text-lg rounded-xl shadow-md transition-all duration-200 bg-success hover:bg-success-dark active:scale-[0.98] disabled:opacity-50 disabled:bg-slate-300 disabled:cursor-not-allowed disabled:active:scale-100 disabled:shadow-none overflow-hidden">
        <span class="btn-text tracking-widest">出 勤</span>
        <!-- Spinner Overlay -->
        <svg class="btn-spinner hidden absolute w-6 h-6 text-white animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
      </button>

      <button id="btn-clock-out" onclick="App.clockOut()" class="relative flex items-center justify-center w-full py-4 text-white font-bold text-lg rounded-xl shadow-md transition-all duration-200 bg-danger hover:bg-danger-dark active:scale-[0.98] disabled:opacity-50 disabled:bg-slate-300 disabled:cursor-not-allowed disabled:active:scale-100 disabled:shadow-none overflow-hidden" disabled>
        <span class="btn-text tracking-widest">退 勤</span>
        <!-- Spinner Overlay -->
        <svg class="btn-spinner hidden absolute w-6 h-6 text-white animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
      </button>
    </section>

    <!-- Visual divider -->
    <hr class="border-slate-200 border-dashed my-2">

    <!-- Task Report Card -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
        <svg class="w-4 h-4 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        課題完了報告
      </h2>
      <div class="flex flex-col gap-3">
        <input type="url" id="task-url" placeholder="https://github.com/..." class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand focus:border-brand text-sm bg-slate-50 transition-colors">
        <button id="btn-report" onclick="App.reportTask()" class="relative flex items-center justify-center w-full py-3 text-white font-bold text-base rounded-xl shadow-md transition-all duration-200 bg-warning hover:bg-warning-dark active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100 disabled:shadow-none overflow-hidden">
          <span class="btn-text">提出する</span>
          <!-- Spinner Overlay -->
          <svg class="btn-spinner hidden absolute w-5 h-5 text-white animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        </button>
      </div>
    </section>

  </main>

  <!-- Core App Logic -->
  <script src="./app.js"></script>
</body>
</html>
